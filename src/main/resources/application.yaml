spring:
  application:
    name: InterviewPilot

  datasource:
    url: jdbc:h2:mem:interviewpilot;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

app:
  # H2's own standalone console server (not mounted in Tomcat — see H2ConsoleConfig for why).
  h2-console:
    port: ${H2_CONSOLE_PORT:8082}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-production-01234567890123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@interviewpilot.com}
    support-address: ${SUPPORT_EMAIL:Intpilotsupport@gmail.com}
  frontend:
    login-url: ${FRONTEND_LOGIN_URL:https://interviewpilot.com/login}
  security:
    max-failed-login-attempts: ${MAX_FAILED_LOGIN_ATTEMPTS:5}
    account-lockout-minutes: ${ACCOUNT_LOCKOUT_MINUTES:15}
    temporary-password-ttl-hours: ${TEMP_PASSWORD_TTL_HOURS:24}
    temporary-password-resend-cooldown-seconds: ${TEMP_PASSWORD_RESEND_COOLDOWN_SECONDS:60}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  # Reuse-window for a user's pending (unpaid) order before we issue a fresh Razorpay order, in minutes.
  pending-order-reuse-minutes: ${RAZORPAY_PENDING_ORDER_REUSE_MINUTES:15}

