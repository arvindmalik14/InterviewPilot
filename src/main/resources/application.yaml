spring:
  application:
    name: InterviewPilot

  datasource:
    url: jdbc:mysql://localhost:3306/interviewpilot?createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: devops
    password: devops

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

app:
  # H2's own standalone console server (not mounted in Tomcat — see H2ConsoleConfig for why).
  h2-console:
    port: ${H2_CONSOLE_PORT:8082}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-production-01234567890123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:arvindmalik14@gmail.com}
    support-address: ${SUPPORT_EMAIL:Intpilotsupport@gmail.com}
  frontend:
    login-url: ${FRONTEND_LOGIN_URL:https://interviewpilot.com/login}
  security:
    max-failed-login-attempts: ${MAX_FAILED_LOGIN_ATTEMPTS:5}
    account-lockout-minutes: ${ACCOUNT_LOCKOUT_MINUTES:15}
    temporary-password-ttl-hours: ${TEMP_PASSWORD_TTL_HOURS:24}
    temporary-password-resend-cooldown-seconds: ${TEMP_PASSWORD_RESEND_COOLDOWN_SECONDS:60}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  # Reuse-window for a user's pending (unpaid) order before we issue a fresh Razorpay order, in minutes.
  pending-order-reuse-minutes: ${RAZORPAY_PENDING_ORDER_REUSE_MINUTES:15}

# --- Migrated from H2 to this MySQL datasource — see MIGRATION.md for the full migration
# --- steps and error fixes. Once the schema is stable in a real deployment, switch
# --- ddl-auto above from "update" to "validate" so Hibernate only checks the schema
# --- matches the entities instead of ever being able to alter it:
#   jpa.hibernate.ddl-auto: validate
