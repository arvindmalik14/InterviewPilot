<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="ip-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="plane-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Speech Bubble / Shield -->
    <path d="M 50 10 
             C 72 10, 90 28, 90 50 
             C 90 68, 77 83, 60 88 
             L 65 102 
             L 48 90 
             C 28 90, 10 72, 10 50 
             C 10 28, 28 10, 50 10 Z" 
          fill="url(#ip-gradient)" />
    
    <!-- Stylized Pilot Wing / Plane (Upward Direction) -->
    <path d="M 32 58 
             L 68 32 
             L 52 68 
             L 46 54 
             Z" 
          fill="#FFFFFF" />
    <path d="M 46 54 
             L 68 32 
             L 52 68 
             L 48 60 
             Z" 
          fill="#E0F2FE" opacity="0.7" />
  </g>

  <!-- Brand Name Typography -->
  <text x="125" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="400" fill="#0F172A" letter-spacing="-0.5">
    Interview<tspan font-weight="800" fill="url(#ip-gradient)">Pilot</tspan>
  </text>

  <!-- Tagline -->
  <text x="127" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748B" letter-spacing="2" text-transform="uppercase">
    CAREER NAVIGATION PLATFORM
  </text>
</svg>
